<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div class="header-container">
      <h1>Rock, Paper, Scissors</h1>
      <p>Play Rock, Paper, and Scissors with a Computer! First to 5 points win.</p>
    </div>
    <div class="choices-container">
      <ul class="choices">
        <li class="choices-option"><button class="rock-btn"><img src="img/icons8-rock-50.png" alt="rock image for rps"></button></li>
        <li class="choices-option"><button class="paper-btn"><img src="img/icons8-paper-50.png" alt="paper image for rps"></button></li>
        <li class="choices-option"><button class="scissors-btn"><img src="img/icons8-scissors-50.png" alt="scissors image for rps"></button></li>
      </ul>
    </div>

    <div class="scoreboard">

    </div>
    <script src="rock_paper_scissors.js"> </script>
  </body>
</html>
